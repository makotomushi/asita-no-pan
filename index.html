<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>予約パンメニュー｜あしたのパン</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;600&family=Shippori+Mincho:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #f7f0e6;
    --warm: #ede0cc;
    --card: #fffdf8;
    --brown: #5c3317;
    --gold: #b8832a;
    --muted: #9a7a5a;
    --border: rgba(184,131,42,0.2);
    --text: #3a2310;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background-color: var(--cream);
    background-image: radial-gradient(var(--border) 1px, transparent 1px);
    background-size: 20px 20px;
    color: var(--text);
    font-family: 'Noto Serif JP', serif;
    min-height: 100vh;
    padding-bottom: 60px;
  }
  .container { max-width: 560px; margin: 0 auto; padding: 0 16px; }

  /* ヘッダー */
  .header-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    margin: 24px 0 20px;
    padding: 32px 24px 28px;
    text-align: center;
    box-shadow: 0 2px 16px rgba(92,51,23,0.07);
  }
  .bread-icon { width:64px; height:64px; background:var(--warm); border-radius:50%; border:2px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:28px; margin:0 auto 16px; }
  .header-en { font-size:0.7rem; letter-spacing:0.35em; color:var(--gold); font-weight:300; margin-bottom:8px; }
  .header-title { font-family:'Shippori Mincho',serif; font-size:2rem; font-weight:600; color:var(--brown); letter-spacing:0.1em; margin-bottom:6px; }
  .header-sub { font-size:0.8rem; color:var(--muted); letter-spacing:0.2em; }

  /* セクションラベル */
  .section-label { display:flex; align-items:center; gap:12px; margin:24px 0 12px; }
  .section-label::before,.section-label::after { content:''; flex:1; height:1px; background:var(--border); }
  .section-label span { font-size:0.68rem; letter-spacing:0.3em; color:var(--gold); }

  /* メニューカード */
  .menu-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 12px;
    box-shadow: 0 1px 8px rgba(92,51,23,0.05);
    overflow: hidden;
    display: flex;
    align-items: stretch;
  }
  /* 写真エリア */
  .menu-img {
    width: 100px;
    min-height: 100px;
    flex-shrink: 0;
    object-fit: cover;
    background: var(--warm);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2rem;
  }
  .menu-img img {
    width: 100px;
    height: 100%;
    min-height: 100px;
    object-fit: cover;
    display: block;
  }
  /* 本文エリア */
  .menu-body { flex: 1; padding: 14px 14px 12px; display: flex; flex-direction: column; justify-content: space-between; }
  .menu-name { font-family:'Shippori Mincho',serif; font-size:1rem; font-weight:600; color:var(--brown); margin-bottom:2px; }
  .menu-note { font-size:0.72rem; color:var(--muted); margin-bottom:10px; }
  .menu-bottom { display:flex; align-items:center; justify-content:space-between; }
  .qty-control { display:flex; align-items:center; gap:10px; }
  .qty-btn { width:30px; height:30px; border-radius:50%; border:1.5px solid var(--gold); background:transparent; color:var(--gold); font-size:1.1rem; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all 0.2s; line-height:1; }
  .qty-btn:hover { background:var(--gold); color:white; }
  .qty-btn:active { transform:scale(0.92); }
  .qty-num { font-family:'Shippori Mincho',serif; font-size:1.2rem; font-weight:600; color:var(--brown); min-width:20px; text-align:center; }
  .menu-price { text-align:right; }
  .price-num { font-family:'Shippori Mincho',serif; font-size:1.1rem; font-weight:600; color:var(--brown); }
  .price-note { font-size:0.65rem; color:var(--muted); margin-top:1px; }

  /* フォーム */
  .form-card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:20px; margin-bottom:12px; box-shadow:0 1px 8px rgba(92,51,23,0.05); }
  .form-group { margin-bottom:16px; }
  .form-group:last-child { margin-bottom:0; }
  .form-label { display:block; font-size:0.78rem; color:var(--muted); margin-bottom:6px; letter-spacing:0.05em; }
  .form-input, .form-textarea { width:100%; padding:10px 14px; border:1px solid var(--border); border-radius:8px; background:var(--cream); color:var(--text); font-family:'Noto Serif JP',serif; font-size:0.95rem; outline:none; transition:border-color 0.2s; }
  .form-input:focus, .form-textarea:focus { border-color:var(--gold); }
  .form-textarea { resize:vertical; min-height:80px; }

  /* 合計 */
  .total-card { background:var(--warm); border:1px solid var(--border); border-radius:12px; padding:18px 20px; margin-bottom:16px; display:flex; justify-content:space-between; align-items:center; }
  .total-label { font-size:0.85rem; color:var(--muted); letter-spacing:0.1em; }
  .total-price { font-family:'Shippori Mincho',serif; font-size:1.5rem; font-weight:600; color:var(--brown); }

  /* ボタン */
  .order-btn { width:100%; padding:16px; background:var(--brown); color:white; border:none; border-radius:12px; font-family:'Shippori Mincho',serif; font-size:1rem; font-weight:600; letter-spacing:0.15em; cursor:pointer; transition:all 0.2s; margin-bottom:10px; }
  .order-btn:hover { background:#7a4520; transform:translateY(-1px); }

  .success-box { display:none; background:#f0faf0; border:1px solid #b0d8b0; border-radius:12px; padding:20px; text-align:center; margin-top:12px; }
  .success-box.show { display:block; }
  .success-box h3 { color:#3a7a3a; font-size:1rem; margin-bottom:8px; }
  .success-box p { font-size:0.82rem; color:#5a8a5a; line-height:1.8; }

  .copy-area { display:none; background:var(--cream); border:1px dashed var(--gold); border-radius:10px; padding:16px; margin-top:14px; font-size:0.82rem; color:var(--text); line-height:1.9; white-space:pre-wrap; word-break:break-all; }
  .copy-area.show { display:block; }

  .copy-btn { display:none; width:100%; margin-top:10px; padding:12px; background:#e8f4e8; color:#3a7a3a; border:1px solid #b0d8b0; border-radius:8px; font-family:'Noto Serif JP',serif; font-size:0.88rem; cursor:pointer; letter-spacing:0.1em; transition:background 0.2s; }
  .copy-btn:hover { background:#d0ecd0; }

  .instagram-btn { display:none; width:100%; margin-top:8px; padding:12px; background:linear-gradient(135deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888); color:white; border:none; border-radius:8px; font-family:'Noto Serif JP',serif; font-size:0.88rem; cursor:pointer; letter-spacing:0.1em; transition:opacity 0.2s; }
  .instagram-btn:hover { opacity:0.9; }
  .instagram-btn.show { display:block; }

  .notice { font-size:0.72rem; color:var(--muted); text-align:center; margin-top:10px; line-height:1.8; }
</style>
</head>
<body>
<div class="container">

  <div class="header-card">
    <div class="bread-icon">🍞</div>
    <p class="header-en">YOYAKU PAN MENU</p>
    <h1 class="header-title">予約パンメニュー</h1>
    <p class="header-sub">あしたのパン　— 東近江市 —</p>
  </div>

  <div class="section-label"><span>MENU</span></div>
  <div id="menu-list"></div>

  <div class="section-label"><span>ORDER</span></div>
  <div class="form-card">
    <div class="form-group">
      <label class="form-label">お名前 *</label>
      <input class="form-input" id="name" type="text" placeholder="山田 花子">
    </div>
    <div class="form-group">
      <label class="form-label">受け取り希望日 *</label>
      <input class="form-input" id="pickup-date" type="date">
    </div>
    <div class="form-group">
      <label class="form-label">ご要望・アレルギーなど</label>
      <textarea class="form-textarea" id="note" placeholder="お気軽にどうぞ"></textarea>
    </div>
  </div>

  <div class="total-card">
    <div class="total-label">合計金額（税込）</div>
    <div class="total-price" id="total-price">¥0</div>
  </div>

  <button class="order-btn" onclick="submitOrder()">📩 Instagramへ注文内容を送る</button>

  <div class="success-box" id="success-box">
    <h3>✅ 注文内容を作成しました！</h3>
    <p>下のテキストをコピーして<br>あしたのパンのInstagramへDMを送ってください。</p>
  </div>

  <div class="copy-area" id="copy-area"></div>
  <button class="copy-btn" id="copy-btn" onclick="copyText()">📋 コピーする</button>
  <button class="instagram-btn" id="instagram-btn" onclick="openInstagram()">📸 Instagramを開く</button>

  <p class="notice">※ このフォームはInstagramのDM送信を補助するものです。<br>注文確定はショップからの返信をもってお知らせします。</p>
</div>

<script>
// img: GitHubにアップロードした画像ファイル名
const MENU = [
  { name: '山形食パン',            note: '1斤',                 price: 730,  img: 'yamagata.jpg' },
  { name: 'キャロットブレッド',    note: '1本',                 price: 980,  img: 'carrot.jpg' },
  { name: 'ココアチョコブレッド',  note: '1本',                 price: 920,  img: 'cocoa.jpg' },
  { name: '四山食パン チョコ',     note: '1斤',                 price: 1150, img: 'shiyama-choco.jpg' },
  { name: '四山食パン レーズン',   note: '1斤',                 price: 920,  img: 'shiyama-raisin.jpg' },
  { name: 'いもいも食パン',        note: '1斤',                 price: 800,  img: 'imo.jpg' },
  { name: 'グラハムブレッド',      note: '1個',                 price: 920,  img: 'graham.jpg' },
  { name: 'ナンテール',            note: 'バター生地込み・1本', price: 850,  img: 'nanterre.jpg' },
  { name: 'ヨーグルトブレッド',    note: '1斤',                 price: 800,  img: 'yogurt.jpg' },
];

const qty = new Array(MENU.length).fill(0);

function renderMenu() {
  document.getElementById('menu-list').innerHTML = MENU.map((item, i) => `
    <div class="menu-card">
      <div class="menu-img">
        <img src="${item.img}" alt="${item.name}" onerror="this.parentElement.innerHTML='🍞'">
      </div>
      <div class="menu-body">
        <div>
          <div class="menu-name">${item.name}</div>
          <div class="menu-note">${item.note}</div>
        </div>
        <div class="menu-bottom">
          <div class="qty-control">
            <button class="qty-btn" onclick="changeQty(${i},-1)">−</button>
            <div class="qty-num" id="qty-${i}">0</div>
            <button class="qty-btn" onclick="changeQty(${i},1)">＋</button>
          </div>
          <div class="menu-price">
            <div class="price-num">¥${item.price.toLocaleString()}</div>
            <div class="price-note">税込 / ${item.note}</div>
          </div>
        </div>
      </div>
    </div>
  `).join('');
}

function changeQty(i, delta) {
  qty[i] = Math.max(0, qty[i] + delta);
  document.getElementById('qty-' + i).textContent = qty[i];
  updateTotal();
}

function updateTotal() {
  const total = MENU.reduce((s, item, i) => s + item.price * qty[i], 0);
  document.getElementById('total-price').textContent = '¥' + total.toLocaleString();
}

function submitOrder() {
  const name = document.getElementById('name').value.trim();
  const date = document.getElementById('pickup-date').value;
  const note = document.getElementById('note').value.trim();
  if (!name) { alert('お名前を入力してください'); return; }
  if (!date) { alert('受け取り希望日を選択してください'); return; }
  const ordered = MENU.filter((_, i) => qty[i] > 0);
  if (ordered.length === 0) { alert('商品を1つ以上選択してください'); return; }

  const total = MENU.reduce((s, item, i) => s + item.price * qty[i], 0);
  const dateStr = new Date(date + 'T00:00:00').toLocaleDateString('ja-JP', { year:'numeric', month:'long', day:'numeric' });

  const lines = [
    '【パン予約のご注文】',
    '',
    'お名前：' + name,
    '受け取り希望日：' + dateStr,
    '',
    '【ご注文内容】',
    ...MENU.filter((_, i) => qty[i] > 0).map(item => {
      const i = MENU.indexOf(item);
      return '・' + item.name + '　×' + qty[i] + '　¥' + (item.price * qty[i]).toLocaleString();
    }),
    '',
    '合計：¥' + total.toLocaleString() + '（税込）',
    ...(note ? ['', 'ご要望：' + note] : []),
    '',
    'よろしくお願いいたします🍞',
  ].join('\n');

  document.getElementById('copy-area').textContent = lines;
  document.getElementById('copy-area').classList.add('show');
  document.getElementById('success-box').classList.add('show');
  document.getElementById('copy-btn').style.display = 'block';
  document.getElementById('instagram-btn').classList.add('show');
  document.getElementById('success-box').scrollIntoView({ behavior:'smooth', block:'start' });
}

function copyText() {
  navigator.clipboard.writeText(document.getElementById('copy-area').textContent).then(() => {
    const btn = document.getElementById('copy-btn');
    btn.textContent = '✅ コピーしました！';
    setTimeout(() => { btn.textContent = '📋 コピーする'; }, 2000);
  });
}

function openInstagram() {
  window.open('https://www.instagram.com/direct/inbox/', '_blank');
}

renderMenu();
</script>
</body>
</html>
